<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PlayLine Admin{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="sidebar bg-dark text-white p-3 vh-100">
    <h5 class="mb-4">🎮 PlayLine Admin</h5>
    <ul class="nav nav-pills flex-column gap-1">
      <li class="nav-item"><a class="nav-link {% if active_page=='dashboard' %}active{% else %}text-white{% endif %}" href="/admin/dashboard">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link {% if active_page=='bookings' %}active{% else %}text-white{% endif %}" href="/admin/bookings">Bookings</a></li>
      <li class="nav-item"><a class="nav-link {% if active_page=='games' %}active{% else %}text-white{% endif %}" href="/admin/games">Gaming Options</a></li>
      <li class="nav-item"><a class="nav-link {% if active_page=='customers' %}active{% else %}text-white{% endif %}" href="/admin/customers">Customers</a></li>
      <li class="nav-item"><a class="nav-link {% if active_page=='support' %}active{% else %}text-white{% endif %}" href="/admin/support">Support</a></li>
      <li class="nav-item"><a class="nav-link {% if active_page=='settings' %}active{% else %}text-white{% endif %}" href="/admin/settings">Settings</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-white-50" href="/admin/logout">Logout</a></li>
    </ul>
  </nav>
  <main class="flex-grow-1 p-4">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/admin.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
